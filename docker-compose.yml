version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend-vite
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: todo-backend-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://todo_user:todo_password@postgres:5432/todo_db
    networks:
      - todo-network

  postgres:
    image: postgres:15
    container_name: todo-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=todo_user
      - POSTGRES_PASSWORD=todo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - todo-network

networks:
  todo-network:

volumes:
  postgres_data: